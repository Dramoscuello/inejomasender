[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
bcrypt = "0.19.3"
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
rand = "0.10.2"
serde = "1.0.229"
serde_json = "1.0.151"
socketioxide = "0.18.5"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time"] }
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs"] }
zip = "8.6.0"
