services:
  postgres:
    image: postgres:15-alpine
    container_name: inejomasender_db
    environment:
      POSTGRES_USER: inejoma_user
      POSTGRES_PASSWORD: inejoma_db_pass
      POSTGRES_DB: inejomasender
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inejoma_user -d inejomasender"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inejomasender_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - DATABASE_URL=postgres://inejoma_user:inejoma_db_pass@postgres:5432/inejomasender
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-password_seguro}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - PORT=${PORT:-3000}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inejomasender_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
